<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Stitch - Checkout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      color: #111;
      background: #fff;
    }

    .logo {
      padding: 12px 20px;
      font-size: 14px;
      color: #333;
      border-bottom: 1px solid #ddd;
    }

    nav {
      padding: 8px 20px;
      border-bottom: 1px solid #ddd;
    }

    nav a {
      color: #0000EE;
      text-decoration: underline;
      margin-right: 10px;
      font-size: 14px;
    }

    nav a:visited { color: #551A8B; }
    nav a:hover { color: #EE0000; }

    main {
      padding: 20px;
      max-width: 600px;
    }

    h1 {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      margin-top: 24px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
      margin-top: 10px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 6px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      border: 1px solid #aaa;
      background: #fff;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > div {
      flex: 1;
    }

    .order-summary {
      margin-top: 24px;
      border: 1px solid #ddd;
      padding: 12px;
      font-size: 14px;
    }

    .order-summary h2 {
      margin-top: 0;
      border-bottom: 1px solid #ddd;
    }

    .order-summary table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
    }

    .order-summary td {
      padding: 5px 0;
      border-bottom: 1px solid #eee;
    }

    .order-summary td:last-child {
      text-align: right;
    }

    .order-summary .total {
      font-weight: bold;
    }

    .place-order-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      font-size: 15px;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      border: 1px solid #aaa;
      cursor: pointer;
    }

    .place-order-btn:hover { background: #eee; }
  </style>
</head>
<body>

 <div class="logo"><img src="logo.jpeg" alt="Urban Stitch Logo" height="50"></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="cart.html">Shopping Cart</a>
    <a href="contact.html">Contact Us</a>
    <a href="product.html">Product Details</a>
  </nav>

  <main>
    <h1>Checkout</h1>

    <form>

      <!-- Contact Info -->
      <h2>Contact Information</h2>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="your@email.com">

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" placeholder="Your phone number">

      <!-- Shipping Address -->
      <h2>Shipping Address</h2>

      <div class="row">
        <div>
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="first-name" placeholder="First name">
        </div>
        <div>
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="last-name" placeholder="Last name">
        </div>
      </div>

      <label for="address">Street Address</label>
      <input type="text" id="address" name="address" placeholder="Street address">

      <label for="suburb">Suburb</label>
      <input type="text" id="suburb" name="suburb" placeholder="Suburb">

      <div class="row">
        <div>
          <label for="state">State</label>
          <select id="state" name="state">
            <option value="">Select state</option>
            <option>NSW</option>
            <option>VIC</option>
            <option>QLD</option>
            <option>WA</option>
            <option>SA</option>
            <option>TAS</option>
            <option>ACT</option>
            <option>NT</option>
          </select>
        </div>
        <div>
          <label for="postcode">Postcode</label>
          <input type="text" id="postcode" name="postcode" placeholder="Postcode">
        </div>
      </div>

      <!-- Payment -->
      <h2>Payment</h2>

      <label for="card-name">Name on Card</label>
      <input type="text" id="card-name" name="card-name" placeholder="Name on card">

      <label for="card-number">Card Number</label>
      <input type="text" id="card-number" name="card-number" placeholder="XXXX XXXX XXXX XXXX">

      <div class="row">
        <div>
          <label for="expiry">Expiry Date</label>
          <input type="text" id="expiry" name="expiry" placeholder="MM/YY">
        </div>
        <div>
          <label for="cvv">CVV</label>
          <input type="text" id="cvv" name="cvv" placeholder="CVV">
        </div>
      </div>

      <!-- Order Summary -->
      <div class="order-summary">
        <h2>Order Summary</h2>
        <table>
          <tr>
            <td>Urban Classic Tee (M) x1</td>
            <td>$35.00</td>
          </tr>
          <tr>
            <td>Street Logo Shirt (L) x1</td>
            <td>$40.00</td>
          </tr>
          <tr>
            <td>Shipping</td>
            <td>$8.00</td>
          </tr>
          <tr class="total">
            <td>Total</td>
            <td>$83.00</td>
          </tr>
        </table>
      </div>

      <button type="submit" class="place-order-btn">Place Order</button>

    </form>
  </main>

</body>
</html>
