<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Stich</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

<div class="logo"><img src="logo.jpeg" alt="Urban Stitch Logo" height="50"></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="cart.html">Shopping Cart</a>
     <a href="Contact Us.html">Contact Us</a>
    <a href="product.html">Product Details</a>
  </nav>

  <main>
    <h1>Shopping Cart</h1>

    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Size</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Subtotal</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Urban Classic Tee</td>
          <td>M</td>
          <td>$35.00</td>
          <td><input type="number" value="1" min="1"></td>
          <td>$35.00</td>
          <td><button class="remove-btn">Remove</button></td>
        </tr>
        <tr>
          <td>Street Logo Shirt</td>
          <td>L</td>
          <td>$40.00</td>
          <td><input type="number" value="1" min="1"></td>
          <td>$40.00</td>
          <td><button class="remove-btn">Remove</button></td>
        </tr>
      </tbody>
    </table>

    <div class="cart-summary">
      <p>Subtotal: $75.00</p>
      <p>Shipping: $8.00</p>
      <p class="total">Total: $83.00</p>
    </div>

    <a href="checkout.html"><button class="checkout-btn">Proceed to Checkout</button></a>
    
  </main>

</body>
</html>
