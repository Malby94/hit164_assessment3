  <main>
    <h1>Contact Us</h1>
    <p>
    Have a question or feedback? Fill out the form below and we'll get back to you as soon as possible.
    </p>
<form>
  <label for="name">Name</label><br>
  <input type="text" id="name" name="name" placeholder="Your name" width="400"><br><br>

  <label for="email">Email</label><br>
  <input type="email" id="email" name="email" placeholder="Your email address" size="40"><br><br>

  <label for="subject">Subject</label><br>
  <input type="text" id="subject" name="subject" placeholder="Subject" size="40"><br><br>

  <label for="message">Message</label><br>
  <textarea id="message" name="message" placeholder="Your message" rows="6" cols="40"></textarea><br><br>

  <input type="submit" value="Send Message">
</form>


  </main>
