<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Stitch - Contact Us</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      color: #111;
      background: #fff;
    }

    /* Header / Logo */
    .logo {
      padding: 12px 20px;
      font-size: 14px;
      color: #333;
      border-bottom: 1px solid #ddd;
    }

    /* Navigation */
    nav {
      padding: 8px 20px;
      border-bottom: 1px solid #ddd;
    }

    nav a {
      color: #0000EE;
      text-decoration: underline;
      margin-right: 10px;
      font-size: 14px;
    }

    nav a:visited { color: #551A8B; }
    nav a:hover { color: #EE0000; }

    /* Main content */
    main {
      padding: 20px 20px;
      max-width: 900px;
    }

    h1 {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }

    h2 {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #111;
      text-align: center;
    }

    p {
      margin-bottom: 16px;
      line-height: 1.5;
      text-align: center;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 6px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      border: 1px solid #aaa;
      margin-bottom: 14px;
      background: #fff;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    input[type="submit"] {
      padding: 6px 18px;
      font-size: 14px;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      border: 1px solid #aaa;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background: #eee;
    }
  </style>
</head>
<body>

<div class="logo"><img src="logo.jpeg" alt="Urban Stitch Logo" height="50"></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="cart.html">Shopping Cart</a>
    <a href="contact.html">Contact Us</a>
    <a href="product.html">Product Details</a>
  </nav>

  <main>
    <h1>Contact Us</h1>
    <p>
    Have a question or feedback? Fill out the form below and we'll get back to you as soon as possible.
    </p>
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Your email address">

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="Subject">

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Your message"></textarea>

      <input type="submit" value="Send Message">
    </form>


  </main>

</body>
</html>
